databases:
  - name: bis-assist-db
    plan: free
    databaseName: bis_assist
    user: bis_assist

services:
  - type: web
    name: bis-assist-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: BIS_DATABASE_URL
        fromDatabase:
          name: bis-assist-db
          property: connectionString
      - key: BIS_CORS_ORIGINS
        value: https://bis-assist.onrender.com
      - key: BIS_LIVE_SEARCH_ENABLED
        value: "true"

  - type: web
    name: bis-assist
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        value: https://bis-assist-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
